<!DOCTYPE html>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arkim AI — About Us</title>
<meta name="theme-color" content="#0A0A0A" />
<script>
(function () {
  try {
    if (localStorage.getItem('arkim-theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#F5F2EB');
    }
  } catch (e) {}
  window.__applyArkimTheme = function (mode) {
    var html = document.documentElement;
    if (mode === 'light') {
      html.setAttribute('data-theme', 'light');
    } else {
      html.removeAttribute('data-theme');
    }
    try {
      localStorage.setItem('arkim-theme', mode === 'light' ? 'light' : 'dark');
    } catch (err) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'light' ? '#F5F2EB' : '#0A0A0A');
    try {
      window.dispatchEvent(new Event('arkim-theme'));
    } catch (err) {}
  };
})();
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const ArkimNav = window.ArkimNav;
const useArkimTheme = window.useArkimTheme;

function useFadeIn() {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } }, { threshold: 0.1 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, vis];
}
function FadeIn({ children, delay = 0, style = {} }) {
  const [ref, vis] = useFadeIn();
  return (
    <div ref={ref} style={{ opacity: vis ? 1 : 0, transform: vis ? 'none' : 'translateY(28px)', transition: `opacity 0.9s cubic-bezier(0.16,1,0.3,1) ${delay}s, transform 0.9s cubic-bezier(0.16,1,0.3,1) ${delay}s`, ...style }}>{children}</div>
  );
}
function Eyebrow({ children }) {
  return <div style={{ fontFamily: 'var(--sans)', fontSize: '11px', fontWeight: 500, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'var(--accent)', marginBottom: '20px' }}>{children}</div>;
}

function Hero() {

}

        </div>
      </div>
    </div>
  );
}
