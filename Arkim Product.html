<meta name="theme-color" content="#0A0A0A" />
<script>
(function () {
  try {
    if (localStorage.getItem('arkim-theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#F5F2EB');
    }
  } catch (e) {}
  window.__applyArkimTheme = function (mode) {
    var html = document.documentElement;
    if (mode === 'light') {
      html.setAttribute('data-theme', 'light');
    } else {
      html.removeAttribute('data-theme');
    }
    try {
      localStorage.setItem('arkim-theme', mode === 'light' ? 'light' : 'dark');
    } catch (err) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'light' ? '#F5F2EB' : '#0A0A0A');
    try {
      window.dispatchEvent(new Event('arkim-theme'));
    } catch (err) {}
  };
})();
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const ArkimNav = window.ArkimNav;
const useArkimTheme = window.useArkimTheme;

// ── Shared helpers ────────────────────────────────────────────────────────────
function useFadeIn(threshold = 0.1) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, vis];
}
function FadeIn({ children, delay = 0, style = {} }) {
  const [ref, vis] = useFadeIn();
  return (
    <div ref={ref} style={{
      opacity: vis ? 1 : 0,
      transform: vis ? 'none' : 'translateY(28px)',
      transition: `opacity 0.9s cubic-bezier(0.16,1,0.3,1) ${delay}s, transform 0.9s cubic-bezier(0.16,1,0.3,1) ${delay}s`,
      ...style,
    }}>{children}</div>
  );
}
function Eyebrow({ children, accent = false }) {
  return (
    <div style={{ fontFamily: 'var(--sans)', fontSize: '11px', fontWeight: 500, letterSpacing: '0.16em', textTransform: 'uppercase', color: accent ? 'var(--accent)' : 'var(--fg-muted)', marginBottom: '20px' }}>
      {children}
    </div>
  );
}
function DemoBtn({ label = 'Request a Demo', style = {} }) {
  return (
    <a href="https://www.arkim.ai/contact?tab=demo" target="_blank" rel="noopener" style={{
      display: 'inline-flex', alignItems: 'center', gap: 8,
      fontFamily: 'var(--sans)', fontSize: '15px', fontWeight: 600,
      background: 'var(--accent)', color: '#000',
      padding: '13px 28px', borderRadius: '6px', textDecoration: 'none',
      transition: 'opacity 0.2s, transform 0.15s', textTransform: 'uppercase',
      ...style,
    }}
    onMouseEnter={e => { e.currentTarget.style.opacity='0.85'; e.currentTarget.style.transform='translateY(-1px)'; }}
    onMouseLeave={e => { e.currentTarget.style.opacity='1'; e.currentTarget.style.transform='none'; }}
    >{label} →</a>
  );
}
function SectionImg({ label, height = '55vh', src = null, alt = '', objectFit = 'cover' }) {
  if (src) {
    if (objectFit === 'contain') {
      return (
        <div style={{
          width: '100%',
          position: 'relative',
          overflow: 'hidden',
          background: 'var(--media-bg, var(--bg))',
          borderTop: '1px solid var(--border)',
          borderBottom: '1px solid var(--border)',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          minHeight: 'clamp(560px, 92vh, 980px)',
          padding: 'clamp(32px, 5vw, 80px) clamp(16px, 4vw, 48px)',
        }}>
          <img
            src={src}
            alt={alt || label}
            loading="lazy"
            decoding="async"
            style={{
              display: 'block',
              width: 'auto',
              height: 'auto',
              maxWidth: '100%',
              maxHeight: 'min(90vh, 880px)',
              objectFit: 'contain',
              objectPosition: 'center',
            }}
          />
        </div>
      );
    }
    return (
      <div style={{
        width: '100%', height, position: 'relative', overflow: 'hidden',
        background: 'var(--media-bg, #000)',
        borderTop: '1px solid var(--border)', borderBottom: '1px solid var(--border)',
      }}>
        <img
          src={src}
          alt={alt || label}
          loading="lazy"
          decoding="async"
          style={{
            width: '100%',
            height: '100%',
            objectFit: 'cover',
            objectPosition: 'center',
            display: 'block',
          }}
        />
      </div>
    );
  }
  return (
    <div style={{
      width: '100%', height, position: 'relative', overflow: 'hidden',
      background: 'repeating-linear-gradient(45deg, #111 0, #111 16px, #0e0e0e 16px, #0e0e0e 32px)',
      borderTop: '1px solid var(--border)', borderBottom: '1px solid var(--border)',
    }}>
      <div style={{
        position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
        flexDirection: 'column', gap: 10, color: 'rgba(245,242,237,0.15)', fontFamily: 'monospace', fontSize: '13px', textAlign: 'center', padding: '32px',
      }}>
        <div style={{ fontSize: 40, opacity: 0.2 }}>◻</div>
        <div>{label}</div>
      </div>
    </div>
  );
}

// ── HERO ─────────────────────────────────────────────────────────────────────

      {/* Video bg */}
      <div style={{ position: 'absolute', inset: 0, zIndex: 0 }}>
        <iframe
          src="https://player.vimeo.com/video/1177525108?autoplay=1&loop=1&muted=1&background=1&title=0&byline=0&portrait=0"

          allow="autoplay; fullscreen"

        />
      </div>
      <div style={{ position: 'absolute', inset: 0, zIndex: 1, background: '#000' }} />
      <div style={{ position: 'relative', zIndex: 2, maxWidth: '760px', textAlign: 'center' }}>
        <div style={{ animation: 'fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.1s both' }}>
          <h1 className="hero-h1">
            <span style={{ fontWeight: 700, color: '#fff', display: 'block' }}>Maintenance solutions</span>
            <span style={{ display: 'block' }}>

              <span className="hero-h1-accent" style={{ display: 'inline' }}>every facility</span>
            </span>
          </h1>
          <p style={{ fontFamily: 'var(--sans)', fontSize: 'clamp(15px, 1.3vw, 16px)', fontWeight: 600, color: 'var(--text-muted)', lineHeight: 1.65, maxWidth: '580px', margin: '0 auto 48px', textWrap: 'pretty' }}>
            Capture knowledge automatically. Diagnose faster. Stop downtime before it starts.
          </p>
        </div>
        {/* Anchor nav */}
        <div style={{ animation: 'fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.35s both' }}>
          <div style={{ display: 'inline-grid', gridTemplateColumns: 'repeat(4, 1fr)', border: '1px solid var(--border)', borderRadius: '12px', overflow: 'hidden', background: 'rgba(10,10,10,0.6)', backdropFilter: 'blur(12px)', maxWidth: '740px', margin: '0 auto' }}>
            {[
              { num: '01', label: 'Diagnose faster', id: 's01' },
              { num: '02', label: 'Capture knowledge', id: 's02' },
              { num: '03', label: 'Maintain smarter', id: 's03' },
              { num: '04', label: 'Your existing tools', id: 's04' },
            ].map((item, i) => (
              <a key={i} href={`#${item.id}`} style={{
                display: 'flex', flexDirection: 'column', gap: 4,
                padding: '20px 24px', textDecoration: 'none',
                borderRight: i < 3 ? '1px solid var(--border)' : 'none',
                transition: 'background 0.2s',
              }}
              onMouseEnter={e => e.currentTarget.style.background='rgba(74,138,191,0.08)'}
              onMouseLeave={e => e.currentTarget.style.background='transparent'}
              >
                <span style={{ fontFamily: 'var(--sans)', fontSize: '11px', letterSpacing: '0.1em', color: 'var(--accent)', fontWeight: 500 }}>{item.num}</span>
                <span style={{ fontFamily: 'var(--sans)', fontSize: '13px', color: 'var(--fg-muted)', fontWeight: 400, lineHeight: 1.3 }}>{item.label}</span>
              </a>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── STICKY ANCHOR NAV (shows when hero nav scrolls away) ─────────────────────
function StickyAnchorNav() {
  const [show, setShow] = useState(false);
  const [active, setActive] = useState(null);
  useEffect(() => {
    const sectionIds = ['s01','s02','s03','s04'];
    const fn = () => {
      setShow(window.scrollY > window.innerHeight * 0.7);
      const found = sectionIds.slice().reverse().find(id => {
        const el = document.getElementById(id);
        return el && el.getBoundingClientRect().top <= 120;
      });
      setActive(found || null);
    };
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);
  if (!show) return null;
  const items = [
    { num: '01', label: 'Diagnose faster', id: 's01' },
    { num: '02', label: 'Capture knowledge', id: 's02' },
    { num: '03', label: 'Maintain smarter', id: 's03' },
    { num: '04', label: 'Your existing tools', id: 's04' },
  ];
  return (
    <div style={{
      position: 'fixed', top: 68, left: 0, right: 0, zIndex: 150,
      background: 'var(--nav-scrim)', backdropFilter: 'blur(16px)',
      borderBottom: '1px solid var(--border)',
      display: 'flex', alignItems: 'stretch', justifyContent: 'center',
      padding: '0 48px', height: '52px', gap: 0,
      transition: 'opacity 0.3s',
    }}>
      {items.map((item, i) => (
        <a key={i} href={`#${item.id}`} style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
          padding: '0 28px', alignSelf: 'stretch', textDecoration: 'none',
          borderRight: i < 3 ? '1px solid var(--border)' : 'none',
          borderBottom: active === item.id ? `2px solid var(--accent)` : '2px solid transparent',
          transition: 'all 0.2s',
        }}
        onMouseEnter={e => e.currentTarget.style.background='rgba(74,138,191,0.06)'}
        onMouseLeave={e => e.currentTarget.style.background='transparent'}
        >
          <span style={{ fontFamily: 'var(--sans)', fontSize: '11px', lineHeight: 1, color: active === item.id ? 'var(--accent)' : 'var(--fg-muted)', fontWeight: 500, letterSpacing: '0.08em' }}>{item.num}</span>
          <span style={{ fontFamily: 'var(--sans)', fontSize: '13px', lineHeight: 1, color: active === item.id ? 'var(--fg)' : 'var(--fg-muted)', fontWeight: 400 }}>{item.label}</span>
        </a>
      ))}
    </div>
  );
}

// ── FEATURE PILLS ─────────────────────────────────────────────────────────────
function FeaturePills({ items }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1px', background: 'var(--border)', border: '1px solid var(--border)', borderRadius: '12px', overflow: 'hidden' }}>
      {items.map((item, i) => (
        <div key={i} style={{
          background: 'var(--bg-card)', padding: '32px 36px',
          transition: 'background 0.2s',
        }}
        onMouseEnter={e => e.currentTarget.style.background='var(--card-hover)'}
        onMouseLeave={e => e.currentTarget.style.background='var(--bg-card)'}
        >
          <div style={{ fontFamily: 'var(--sans)', fontSize: '15px', fontWeight: 600, color: 'var(--fg)', marginBottom: '10px' }}>{item.title}</div>
          <div style={{ fontFamily: 'var(--sans)', fontSize: '14px', fontWeight: 300, color: 'var(--fg-muted)', lineHeight: 1.65, textWrap: 'pretty' }}>{item.body}</div>
        </div>
      ))}
    </div>
  );
}

// ── STAT BLOCK ────────────────────────────────────────────────────────────────
function StatBlock({ num, label, sub }) {
  return (
    <div style={{ padding: '48px 0', borderTop: '1px solid var(--border)' }}>
      <div style={{ fontFamily: 'var(--sans)', fontSize: 'clamp(30px, 4vw, 52px)', fontWeight: 700, color: 'var(--accent)', lineHeight: 1, letterSpacing: '0.01em', marginBottom: '12px' }}>{num}</div>
      <div style={{ fontFamily: 'var(--sans)', fontSize: '18px', fontWeight: 500, color: 'var(--fg)', marginBottom: '8px' }}>{label}</div>
      {sub && <div style={{ fontFamily: 'var(--sans)', fontSize: '15px', fontWeight: 300, color: 'var(--fg-muted)', lineHeight: 1.6, maxWidth: '560px', textWrap: 'pretty' }}>{sub}</div>}
    </div>
  );
}

// ── SECTION WRAPPER ───────────────────────────────────────────────────────────
function Section({ id, eyebrow, headline, sub, imageLabel, imageSrc = null, imageAlt = '', imageHeight = '55vh', imageObjectFit = 'cover', children, statNum, statLabel, statSub }) {
  return (
    <div id={id} style={{ borderTop: '1px solid var(--border)' }}>
      <div style={{ maxWidth: '1300px', margin: '0 auto', padding: '100px 80px 60px' }}>
        <FadeIn>
          <Eyebrow accent>{eyebrow}</Eyebrow>
          <h2 style={{ fontFamily: 'var(--sans)', fontSize: 'var(--title-h2-lg)', fontWeight: 700, lineHeight: 1.08, letterSpacing: 'var(--title-h2-letter-spacing)', marginBottom: '24px', maxWidth: '800px', textWrap: 'balance' }}>{headline}</h2>
          <p style={{ fontFamily: 'var(--sans)', fontSize: '18px', fontWeight: 300, color: 'var(--fg-muted)', lineHeight: 1.75, maxWidth: '640px', textWrap: 'pretty', marginBottom: '60px' }}>{sub}</p>
        </FadeIn>
        <FadeIn delay={0.1}>{children}</FadeIn>
      </div>
      <FadeIn>
        <SectionImg label={imageLabel} height={imageHeight} src={imageSrc} alt={imageAlt} objectFit={imageObjectFit} />
      </FadeIn>
      {statNum && (
        <div style={{ maxWidth: '1300px', margin: '0 auto', padding: '0 80px' }}>
          <FadeIn delay={0.1}>
            <StatBlock num={statNum} label={statLabel} sub={statSub} />
          </FadeIn>
        </div>
      )}
      <div style={{ maxWidth: '1300px', margin: '0 auto', padding: '40px 80px 80px' }}>
        <FadeIn>
          <DemoBtn />
        </FadeIn>
      </div>
    </div>
  );
}

// ── SECTION 01 — DIAGNOSE FASTER ─────────────────────────────────────────────

function S03() {

      headline="The manufacturer's schedule is a starting point. Arkim makes it better every day."
      sub="Most facilities run the maintenance schedule that came in the manual. Arkim learns from your actual equipment, in your actual conditions, and adjusts the schedule automatically."
