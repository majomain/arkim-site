<script>
(function () {
  try {
    var stored = localStorage.getItem('arkim-theme');
    var m = document.querySelector('meta[name="theme-color"]');
    if (stored === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      if (m) m.setAttribute('content', '#0A0A0A');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      if (m) m.setAttribute('content', '#F5F2EB');
    }
  } catch (e) {}
  window.__applyArkimTheme = function (mode) {
    var html = document.documentElement;
    if (mode === 'light') {
      html.setAttribute('data-theme', 'light');
    } else {
      html.removeAttribute('data-theme');
    }
    try {
      localStorage.setItem('arkim-theme', mode === 'light' ? 'light' : 'dark');
    } catch (err) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'light' ? '#F5F2EB' : '#0A0A0A');
    try {
      window.dispatchEvent(new Event('arkim-theme'));
    } catch (err) {}
  };
})();
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const ArkimNav = window.ArkimNav;
const useArkimTheme = window.useArkimTheme;
const usePrefersReducedMotion = window.usePrefersReducedMotion;

// ── Shared helpers ────────────────────────────────────────────────────────────
function useFadeIn(threshold = 0.1) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, vis];
}

/** Viewport ≤ breakpoint: single-column grids + tighter section padding (matches nav @768) */
function useIsNarrowLayout(breakpointPx = 768) {
  const [narrow, setNarrow] = useState(() =>
    typeof window !== 'undefined' && window.matchMedia(`(max-width: ${breakpointPx}px)`).matches
  );
  useEffect(() => {
    const mq = window.matchMedia(`(max-width: ${breakpointPx}px)`);
    const update = () => setNarrow(mq.matches);
    mq.addEventListener('change', update);
    return () => mq.removeEventListener('change', update);
  }, [breakpointPx]);
  return narrow;
}

function FadeIn({ children, delay = 0, y = 28, style = {} }) {
  const [ref, vis] = useFadeIn();
  const reducedMotion = usePrefersReducedMotion();
  const effectiveDelay = reducedMotion ? 0 : delay;
  return (
    <div ref={ref} style={{
      opacity: vis ? 1 : 0,
      transform: reducedMotion ? 'none' : (vis ? 'none' : `translateY(${y}px)`),
      transition: reducedMotion
        ? 'none'
        : `opacity 0.9s cubic-bezier(0.16,1,0.3,1) ${effectiveDelay}s, transform 0.9s cubic-bezier(0.16,1,0.3,1) ${effectiveDelay}s`,
      ...style,
    }}>{children}</div>
  );
}
function Eyebrow({ children, accent = false }) {
  return (
    <div style={{ fontFamily: 'var(--sans)', fontSize: '11px', fontWeight: 500, letterSpacing: '0.16em', textTransform: 'uppercase', color: accent ? 'var(--accent)' : 'var(--fg-muted)', marginBottom: '20px' }}>
      {children}
    </div>
  );
}

    <a href="https://www.arkim.ai/contact?tab=demo" target="_blank" rel="noopener" style={{
      display: 'inline-flex', alignItems: 'center', gap: 8,

      transition: 'opacity 0.2s, transform 0.2s cubic-bezier(0.16,1,0.3,1)', textTransform: 'uppercase',

}

            decoding="async"

              width: 'auto',
              height: 'auto',

              maxHeight: 'min(90vh, 880px)',

        <div style={{ fontSize: 40, opacity: 0.2 }}>◻</div>
        <div>{label}</div>
      </div>
    </div>
  );
}

        {heroFade(0.35, (

// ── STICKY ANCHOR NAV (shows when hero nav scrolls away) ─────────────────────
function StickyAnchorNav() {
  const [show, setShow] = useState(false);
  const [active, setActive] = useState(null);
  const narrow = useIsNarrowLayout();
  useEffect(() => {
    const sectionIds = ['s01','s02','s03','s04'];
    const fn = () => {
      setShow(window.scrollY > window.innerHeight * 0.7);
      const found = sectionIds.slice().reverse().find(id => {
        const el = document.getElementById(id);
        return el && el.getBoundingClientRect().top <= 120;
      });
      setActive(found || null);
    };
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);
  if (!show) return null;
  const items = [
    { num: '01', label: 'Diagnose faster', id: 's01' },
    { num: '02', label: 'Capture knowledge', id: 's02' },
    { num: '03', label: 'Maintain smarter', id: 's03' },
    { num: '04', label: 'Your existing tools', id: 's04' },
  ];
  return (
    <div style={{
      position: 'fixed',
      top: 'calc(68px + env(safe-area-inset-top, 0px))',
      left: 0,
      right: 0,
      zIndex: 150,
      background: 'var(--nav-scrim)', backdropFilter: 'blur(16px)',
      borderBottom: '1px solid var(--border)',
      display: 'flex', alignItems: 'stretch',
      justifyContent: narrow ? 'flex-start' : 'center',
      overflowX: narrow ? 'auto' : 'visible',
      WebkitOverflowScrolling: 'touch',
      touchAction: 'pan-x',
      padding: narrow ? '0 10px' : '0 48px', height: '52px', gap: 0,
      transition: 'opacity 0.3s',
    }}>
      {items.map((item, i) => (
        <a key={i} href={`#${item.id}`} style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
          flexShrink: 0,
          padding: narrow ? '0 14px' : '0 28px', alignSelf: 'stretch', textDecoration: 'none',
          borderRight: i < 3 ? '1px solid var(--border)' : 'none',
          borderBottom: active === item.id ? `2px solid var(--accent)` : '2px solid transparent',
          transition: 'background 0.2s',
        }}
        onMouseEnter={e => {
          e.currentTarget.style.background = 'rgba(74,138,191,0.06)';
        }}
        onMouseLeave={e => {
          e.currentTarget.style.background = 'transparent';
        }}
        >
          <span style={{ fontFamily: 'var(--sans)', fontSize: '11px', lineHeight: 1, color: active === item.id ? 'var(--accent)' : 'var(--fg-muted)', fontWeight: 500, letterSpacing: '0.08em' }}>{item.num}</span>

        </a>
      ))}
    </div>
  );
}

  const narrow = useIsNarrowLayout();
  const [adapted, setAdapted] = useState(false);
  useEffect(() => {
    const t = setInterval(() => setAdapted((v) => !v), 4500);
    return () => clearInterval(t);
  }, []);

  const baselinePct = [10, 30, 50, 70, 90];
  const adaptedPct = [10, 22, 44, 63, 88];
  const eventPct = [35, 58];

  return (
    <div
      role="img"
      aria-label="Diagram: evenly spaced maintenance markers on a timeline shift after observed events"
      style={{
        width: '100%',
        minHeight: narrow ? 'min(52vh, 420px)' : 'clamp(300px, 48vh, 520px)',
        position: 'relative',
        overflow: 'hidden',
