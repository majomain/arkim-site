<script>
(function () {
  try {
    if (localStorage.getItem('arkim-theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#F5F2EB');
    }
  } catch (e) {}
  window.__applyArkimTheme = function (mode) {
    var html = document.documentElement;
    if (mode === 'light') {
      html.setAttribute('data-theme', 'light');
    } else {
      html.removeAttribute('data-theme');
    }
    try {
      localStorage.setItem('arkim-theme', mode === 'light' ? 'light' : 'dark');
    } catch (err) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'light' ? '#F5F2EB' : '#0A0A0A');
    try {
      window.dispatchEvent(new Event('arkim-theme'));
    } catch (err) {}
  };
})();
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const ArkimNav = window.ArkimNav;
const useArkimTheme = window.useArkimTheme;

function useFadeIn(threshold = 0.1) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, vis];
}

function useIsNarrowLayout(breakpointPx = 768) {
  const [narrow, setNarrow] = useState(() =>
    typeof window !== 'undefined' && window.matchMedia(`(max-width: ${breakpointPx}px)`).matches
  );
  useEffect(() => {
    const mq = window.matchMedia(`(max-width: ${breakpointPx}px)`);
    const update = () => setNarrow(mq.matches);
    mq.addEventListener('change', update);
    return () => mq.removeEventListener('change', update);
  }, [breakpointPx]);
  return narrow;
}

function FadeIn({ children, delay = 0, style = {} }) {
  const [ref, vis] = useFadeIn();
  return (
    <div ref={ref} style={{
      opacity: vis ? 1 : 0,
      transform: vis ? 'none' : 'translateY(28px)',
      transition: `opacity 0.9s cubic-bezier(0.16,1,0.3,1) ${delay}s, transform 0.9s cubic-bezier(0.16,1,0.3,1) ${delay}s`,
      ...style,
    }}>{children}</div>
  );
}
function Eyebrow({ children, accent = false }) {
  return (
    <div style={{ fontFamily: 'var(--sans)', fontSize: '11px', fontWeight: 500, letterSpacing: '0.16em', textTransform: 'uppercase', color: accent ? 'var(--accent)' : 'var(--fg-muted)', marginBottom: '20px' }}>
      {children}

  );
}
function DemoBtn({ label = 'Request a Demo', style = {} }) {

    onMouseLeave={e => { e.currentTarget.style.opacity='1'; e.currentTarget.style.transform='none'; }}

}
function SectionImg({ label, height = '55vh' }) {

}

function StickyAnchorNav() {
  const [show, setShow] = useState(false);
  const [active, setActive] = useState(null);
  const narrow = useIsNarrowLayout();
  useEffect(() => {
    const sectionIds = ['s01','s02','s03'];
    const fn = () => {
      setShow(window.scrollY > window.innerHeight * 0.7);
      const found = sectionIds.slice().reverse().find(id => {
        const el = document.getElementById(id);
        return el && el.getBoundingClientRect().top <= 120;
      });
      setActive(found || null);
    };
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);
  if (!show) return null;
  return (
    <div style={{
      position: 'fixed',
      top: 'calc(68px + env(safe-area-inset-top, 0px))',
      left: 0,
      right: 0,
      zIndex: 150,
      background: 'var(--nav-scrim)', backdropFilter: 'blur(16px)',
      borderBottom: '1px solid var(--border)',
      display: 'flex', alignItems: 'stretch',
      justifyContent: narrow ? 'flex-start' : 'center',
      overflowX: narrow ? 'auto' : 'visible',
      WebkitOverflowScrolling: 'touch',
      touchAction: 'pan-x',
      padding: narrow ? '0 10px' : '0 48px', height: '52px', gap: 0,
      transition: 'opacity 0.3s',
    }}>
      {ANCHOR_ITEMS.map((item, i) => (
        <a key={i} href={`#${item.id}`} style={{
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
          flexShrink: 0,
          padding: narrow ? '0 14px' : '0 28px', alignSelf: 'stretch', textDecoration: 'none',
          borderRight: i < 2 ? '1px solid var(--border)' : 'none',
          borderBottom: active === item.id ? `2px solid var(--accent)` : '2px solid transparent',
          transition: 'all 0.2s',
        }}
        onMouseEnter={e => e.currentTarget.style.background='rgba(74,138,191,0.06)'}
        onMouseLeave={e => e.currentTarget.style.background='transparent'}
        >
          <span style={{ fontFamily: 'var(--sans)', fontSize: '11px', lineHeight: 1, color: active === item.id ? 'var(--accent)' : 'var(--fg-muted)', fontWeight: 500, letterSpacing: '0.08em' }}>{item.num}</span>
          <span style={{ fontFamily: 'var(--sans)', fontSize: '13px', lineHeight: 1, color: active === item.id ? 'var(--fg)' : 'var(--fg-muted)', fontWeight: 400 }}>{item.label}</span>
        </a>
      ))}
    </div>
  );
}

            borderRadius: '12px',
            overflow: 'hidden',
            background: 'var(--bg-card)',
            transition: 'background 0.2s',
          }}
          onMouseEnter={e => { e.currentTarget.style.background='#1a1a1a'; }}
          onMouseLeave={e => { e.currentTarget.style.background='var(--bg-card)'; }}
          >
            <div style={{ padding: narrow ? '28px 22px' : '40px 44px' }}>
              <div style={{ fontFamily: 'var(--sans)', fontSize: '11px', letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--accent)', fontWeight: 500, marginBottom: '16px' }}>Announcement</div>
              <h3 style={{ fontFamily: 'var(--sans)', fontSize: 'clamp(20px, 2vw, 28px)', fontWeight: 700, lineHeight: 1.15, marginBottom: '12px', letterSpacing: '-0.02em' }}>
                Arkim Joins NVIDIA Inception Program
              </h3>
              <div style={{ fontFamily: 'var(--sans)', fontSize: '14px', color: 'var(--fg-muted)', marginBottom: '20px' }}>July 18, 2025</div>
              <p style={{ fontFamily: 'var(--sans)', fontSize: '16px', fontWeight: 300, color: 'var(--fg-muted)', lineHeight: 1.7, maxWidth: '640px', textWrap: 'pretty', marginBottom: '28px' }}>
                We're excited to announce that Arkim AI has been accepted into the prestigious NVIDIA Inception Program, accelerating our developments.
              </p>
              <a
                href="https://www.arkim.ai/resources/nvidia-inception-program"
                target="_blank"
                rel="noopener"
                style={{
                  fontFamily: 'var(--sans)', fontSize: '15px', fontWeight: 600, color: 'var(--accent)', textDecoration: 'none',
                  display: 'inline-flex', alignItems: 'center', gap: 6,
                }}
              >Read More →</a>
            </div>
          </div>
        </FadeIn>
      </div>
      <FadeIn>
        <SectionImg label="NVIDIA partnership / program badge — dark, subtle" height="42vh" />
      </FadeIn>
      <div style={{ maxWidth: '1300px', margin: '0 auto', padding: `40px ${gx}px 80px` }}>
        <FadeIn><DemoBtn /></FadeIn>
      </div>
    </div>
  );
}

function FinalCTA() {
  const narrow = useIsNarrowLayout();
  return (
    <div style={{ borderTop: '1px solid var(--border)', background: 'linear-gradient(to bottom, #0A0A0A, #0c0e0f)', position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%,-50%)', width: '700px', height: '400px', background: 'radial-gradient(ellipse, rgba(74,138,191,0.07) 0%, transparent 70%)', pointerEvents: 'none' }} />
      <div style={{ maxWidth: '860px', margin: '0 auto', padding: narrow ? '72px 22px' : '120px 48px', textAlign: 'center', position: 'relative' }}>
        <FadeIn>
          <Eyebrow>Let's Talk</Eyebrow>
          <h2 style={{ fontFamily: 'var(--sans)', fontSize: 'var(--title-h2-xl)', fontWeight: 700, lineHeight: 1.06, letterSpacing: 'var(--title-h2-letter-spacing)', marginBottom: '20px', textWrap: 'balance' }}>
            Questions about<br /><em style={{ fontStyle: 'normal', color: 'var(--accent)' }}>our resources?</em>
          </h2>
          <p style={{ fontFamily: 'var(--sans)', fontSize: '18px', fontWeight: 300, color: 'var(--fg-muted)', lineHeight: 1.7, marginBottom: '40px' }}>
            Reach out for the full picture on how Arkim fits your maintenance operations.
          </p>
          <DemoBtn label="Request a Demo" style={{ fontSize: '16px', padding: '15px 36px' }} />
          <p style={{ fontFamily: 'var(--sans)', fontSize: '14px', color: 'var(--fg-muted)', marginTop: '20px' }}>No pitch deck. No commitment.</p>
        </FadeIn>
      </div>
    </div>
  );
}

function Footer() {
  const narrow = useIsNarrowLayout();
  const isLightTheme = useArkimTheme();
  const logoLightSurface =
    (window.__resources && window.__resources.logoSideBySide) || 'uploads/arkim-side-by-side.svg';
  const logoDarkSurface =
    (window.__resources && window.__resources.logoSideBySideWht) || 'uploads/arkim-side-by-side-wht.svg';
  const footerLogoSrc = isLightTheme ? logoLightSurface : logoDarkSurface;
  return (
    <footer style={{ borderTop: '1px solid var(--border)', padding: narrow ? '40px 22px 28px' : '48px 80px 32px', maxWidth: '1300px', margin: '0 auto' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '32px', flexWrap: 'wrap', gap: 16 }}>
        <a href="index.html" style={{ display: 'flex', alignItems: 'center', gap: 10, textDecoration: 'none' }}>
          <img src={footerLogoSrc} alt="Arkim" style={{ height: 24, width: 'auto', display: 'block' }} />
        </a>
        <div style={{ display: 'flex', gap: 32 }}>
          {[{ label: 'Homepage', href: 'index.html' }, { label: 'Contact', href: 'https://www.arkim.ai/contact' }, { label: 'Request Demo', href: 'https://www.arkim.ai/contact?tab=demo' }].map((l, i) => (
            <a key={i} href={l.href} style={{ fontFamily: 'var(--sans)', fontSize: '14px', color: 'var(--fg-muted)', textDecoration: 'none', transition: 'color 0.2s' }}
            onMouseEnter={e => e.target.style.color='var(--fg)'}
            onMouseLeave={e => e.target.style.color='var(--fg-muted)'}
            >{l.label}</a>
          ))}
        </div>
      </div>
      <div style={{ borderTop: '1px solid var(--border)', paddingTop: '24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 16 }}>
        <span style={{ fontFamily: 'var(--sans)', fontSize: '13px', color: 'var(--fg-muted)' }}>© 2026 Arkim AI. All rights reserved.</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
          {[{ src: (window.__resources && window.__resources.nvidiaLogo) || 'https://www.arkim.ai/images/nvidia-inception.png', alt: 'NVIDIA' }, { src: (window.__resources && window.__resources.databricksLogo) || 'https://www.arkim.ai/images/databricks-logo.svg', alt: 'Databricks' }, { src: (window.__resources && window.__resources.awsLogo) || 'https://www.arkim.ai/images/aws-activate.svg', alt: 'AWS' }].map((p, i) => (
            <img key={i} src={p.src} alt={p.alt} style={{
              height: 18,
              opacity: 'var(--partner-logo-opacity)',
              filter: 'var(--partner-logo-filter)',
              transition: 'opacity 0.2s',
            }}
            onMouseEnter={e => { e.target.style.opacity = 'var(--partner-logo-hover-opacity)'; }}
            onMouseLeave={e => { e.target.style.opacity = 'var(--partner-logo-opacity)'; }}
            />
          ))}
        </div>
      </div>
    </footer>
  );
}

function App() {
  return (
    <div>
      <div style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 200, paddingTop: 'env(safe-area-inset-top, 0px)' }}>
        <ArkimNav activeLabel="Resources" />
      </div>
      <div style={{ height: 'calc(68px + env(safe-area-inset-top, 0px))' }} />
      <Hero />
      <StickyAnchorNav />
      <S01 />
      <S02 />
      <S03 />
      <FinalCTA />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
