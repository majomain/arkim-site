<meta name="theme-color" content="#F5F2EB" />
<link rel="icon" href="/uploads/favicon-32x32.png" type="image/png" sizes="32x32" />
<script>
(function () {
  try {
    var stored = localStorage.getItem('arkim-theme');
    var m = document.querySelector('meta[name="theme-color"]');
    if (stored === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      if (m) m.setAttribute('content', '#0A0A0A');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      if (m) m.setAttribute('content', '#F5F2EB');
    }
  } catch (e) {}
  window.__applyArkimTheme = function (mode) {
    var html = document.documentElement;
    if (mode === 'light') {
      html.setAttribute('data-theme', 'light');
    } else {
      html.removeAttribute('data-theme');
    }
    try {
      localStorage.setItem('arkim-theme', mode === 'light' ? 'light' : 'dark');
    } catch (err) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'light' ? '#F5F2EB' : '#0A0A0A');
    try {
      window.dispatchEvent(new Event('arkim-theme'));
    } catch (err) {}
  };
})();
</script>

const { useState, useEffect, useRef } = React;

const useArkimTheme = window.useArkimTheme;

function useFadeIn() {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } }, { threshold: 0.1 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, vis];
}

function useIsNarrowLayout(breakpointPx = 768) {
  const [narrow, setNarrow] = useState(() =>
    typeof window !== 'undefined' && window.matchMedia(`(max-width: ${breakpointPx}px)`).matches
  );
  useEffect(() => {
    const mq = window.matchMedia(`(max-width: ${breakpointPx}px)`);
    const update = () => setNarrow(mq.matches);
    mq.addEventListener('change', update);
    return () => mq.removeEventListener('change', update);
  }, [breakpointPx]);
  return narrow;
}

function FadeIn({ children, delay = 0, style = {} }) {
  const [ref, vis] = useFadeIn();
  return (
    <div ref={ref} style={{ opacity: vis ? 1 : 0, transform: vis ? 'none' : 'translateY(28px)', transition: `opacity 0.9s cubic-bezier(0.16,1,0.3,1) ${delay}s, transform 0.9s cubic-bezier(0.16,1,0.3,1) ${delay}s`, ...style }}>{children}</div>
  );
}
function Eyebrow({ children }) {
  return <div style={{ fontFamily: 'var(--sans)', fontSize: '11px', fontWeight: 500, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'var(--accent)', marginBottom: '20px' }}>{children}</div>;
}

function App() {
