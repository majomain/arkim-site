<script>
(function () {
  try {
    var stored = localStorage.getItem('arkim-theme');
    var m = document.querySelector('meta[name="theme-color"]');
    if (stored === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      if (m) m.setAttribute('content', '#0A0A0A');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      if (m) m.setAttribute('content', '#FAFAFA');
    }
  } catch (e) {}
  window.__applyArkimTheme = function (mode) {
    var html = document.documentElement;
    if (mode === 'light') {
      html.setAttribute('data-theme', 'light');
    } else {
      html.removeAttribute('data-theme');
    }
    try {
      localStorage.setItem('arkim-theme', mode === 'light' ? 'light' : 'dark');
    } catch (err) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'light' ? '#FAFAFA' : '#0A0A0A');
    try {
      window.dispatchEvent(new Event('arkim-theme'));
    } catch (err) {}
  };
})();
</script>

  --body: "proxima-nova", Helvetica, sans-serif;
  /* Type scale — heading tokens in arkim-hero.css; homepage display/section aliases step up one h2 tier */
  --text-eyebrow-size: clamp(14px, 1.1vw, 17px);
  --text-eyebrow-tracking: 0.12em;
  --text-body: 17px;
  --text-body-weight: 400;
  --text-label: 15px;
  --text-caption: 16px;
  --text-micro: 13px;
  --title-display: var(--title-h2-xl);
  --title-section: var(--title-h2-lg);
  /* Section / display h2 — slightly negative tracking reads tighter than 0.01em on bold sans */

}

html[data-theme="light"] {
  color-scheme: light;
  --bg: #fafafa;
  --bg-card: #ffffff;
  --border: #e5e5e5;
  --fg: #1c1915;
  /* Softer than body — matches arkim-theme.css subpages */

  --p-fg: #000000;
  --accent: #1473cc;
  --btn-fg: #ffffff;
  --nav-scrim: rgba(250, 250, 250, 0.94);
  --hero-bg: #f2f2f2;
  --hero-title: #1c1915;
  --fg-faint: rgba(28, 25, 21, 0.38);
  --fg-ghost: rgba(28, 25, 21, 0.45);
  --fg-dimmer: rgba(28, 25, 21, 0.42);
  --outline: rgba(28, 25, 21, 0.14);
  --outline-hover: rgba(28, 25, 21, 0.28);
  --outline-fill: rgba(28, 25, 21, 0.05);
  --card-hover: #f3f3f3;
  --placeholder-a: #eeeeee;
  --placeholder-b: #e4e4e4;
  --placeholder-label: rgba(28, 25, 21, 0.35);

  --accent-soft: rgba(20, 115, 204, 0.09);
  --accent-border: rgba(20, 115, 204, 0.35);

  --announce-border: rgba(20, 115, 204, 0.25);
  --media-bg: #0a0a0a;
  --media-shadow: rgba(0, 0, 0, 0.22);
  --final-cta-1: #f5f5f5;

  --partner-logo-hover-opacity: 0.86;
  --partner-logo-filter: brightness(0) saturate(100%);
  --selection: rgba(20, 115, 204, 0.22);
}

html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-weight: var(--text-body-weight);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Marquee ── */
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

@media (prefers-reduced-motion: reduce) {
  @keyframes marquee {
    from, to { transform: translateX(0); }
  }
}

/* ── Ken Burns hero bg ── */
@keyframes kenburns {
  from { transform: scale(1.06) translate(-1%, 0); }
  to   { transform: scale(1) translate(1%, 1%); }
}

/* ── Trust progress bar ── */
@keyframes trustProgress {
  from { width: 0%; }
  to   { width: 100%; }
}

/* ── Global selection ── */
::selection { background: var(--selection); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Keyboard / accessibility: clear focus without hurting mouse users */
:focus:not(:focus-visible) { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
button:focus-visible { border-radius: 4px; }

/* Homepage — interactive surfaces (CSS hover/focus replaces inline JS) */
a.arkim-btn-outline {
  font-family: var(--sans);
  font-size: var(--text-label);
  font-weight: 500;
  color: var(--fg);
  border: 1px solid var(--outline);
  padding: 14px 30px;
  border-radius: 6px;
  text-decoration: none;
  background: transparent;
  text-transform: uppercase;
  display: inline-block;
  transition: border-color 0.2s, background 0.2s, opacity 0.2s, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
a.arkim-btn-outline:hover,
a.arkim-btn-outline:focus-visible,
button.arkim-btn-outline:hover,
button.arkim-btn-outline:focus-visible {
  border-color: var(--outline-hover);
  background: var(--outline-fill);
  opacity: 0.95;
  transform: translateY(-2px);
}

button.arkim-btn-outline {
  font-family: var(--sans);
  font-size: var(--text-label);
  font-weight: 500;
  color: var(--fg);
  border: 1px solid var(--outline);
  padding: 14px 30px;
  border-radius: 6px;
  background: transparent;
  text-transform: uppercase;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  min-height: 44px;
  transition: border-color 0.2s, background 0.2s, opacity 0.2s, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Vimeo demo modal (hero “See how it works”) */
.arkim-video-modal {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  background: rgba(0, 0, 0, 0.82);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: arkim-modal-fade-in 0.25s ease;
}

.arkim-video-modal__dialog {
  position: relative;
  width: min(960px, 100%);
  border-radius: 12px;
  overflow: hidden;
  border: none;
  background: var(--media-bg);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.1),
    0 40px 100px rgba(0, 0, 0, 0.55);
}

.arkim-video-modal__frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
}

.arkim-video-modal__frame iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.arkim-video-modal__close {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 2;
  width: 44px;
  height: 44px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.72);
  color: #f5f2ed;
  font-family: var(--sans);
  font-size: 26px;
  font-weight: 300;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}

.arkim-video-modal__close:hover,
.arkim-video-modal__close:focus-visible {
  background: rgba(0, 0, 0, 0.88);
  border-color: rgba(255, 255, 255, 0.4);
  color: #ffffff;
}

@media (max-width: 768px) {
  .arkim-video-modal {
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    align-items: center;
  }
  .arkim-video-modal__dialog {
    width: 100%;
    max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
  .arkim-video-modal__frame {
    max-height: calc(100dvh - 88px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
  .arkim-video-modal__close {
    top: 8px;
    right: 8px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
}

@keyframes arkim-modal-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .arkim-video-modal {
    animation: none;
  }
}

button.arkim-btn-primary {

.arkim-cta-photo {

@media (prefers-reduced-motion: reduce) {
  a.arkim-btn-outline:hover,

  button.arkim-btn-outline:focus-visible,
