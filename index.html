// ─── UTILS ──────────────────────────────────────────────────────────────────

function useFadeIn(threshold = 0.12) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } },
      { threshold }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, vis];
}

function FadeIn({ children, delay = 0, y = 28, style = {} }) {
  const [ref, vis] = useFadeIn();
  return (
    <div ref={ref} style={{
      opacity: vis ? 1 : 0,
      transform: vis ? 'none' : `translateY(${y}px)`,
      transition: `opacity 0.9s cubic-bezier(0.16,1,0.3,1) ${delay}s, transform 0.9s cubic-bezier(0.16,1,0.3,1) ${delay}s`,
      ...style
    }}>{children}</div>
  );
}

function Eyebrow({ children, center = false }) {
  return (
    <div style={{
      fontFamily: 'var(--sans)',
      fontSize: '11px',
      fontWeight: 500,
      letterSpacing: '0.15em',
      textTransform: 'uppercase',
      color: 'var(--accent)',

      textAlign: center ? 'center' : 'left',

    visual: 'Document fragments flowing into a unified search result card',
  },
];

function ThreeLayers() {
  const [active, setActive] = useState(0);
  const containerRef = useRef(null);

  useEffect(() => {
    const onScroll = () => {
      if (!containerRef.current) return;
      const { top, height } = containerRef.current.getBoundingClientRect();
      const scrolled = -top;
      const scrollable = height - window.innerHeight;
      const pct = Math.max(0, Math.min(1, scrolled / scrollable));
      setActive(Math.min(2, Math.floor(pct * 3)));
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const layer = LAYERS[active];
  // Alternate: even index = text left / visual right; odd = visual left / text right
  const isReversed = active % 2 === 1;

  return (
    <div id="layers" ref={containerRef} style={{ height: '300vh', position: 'relative' }}>
      <div style={{
        position: 'sticky', top: 0, height: '100vh',
        display: 'flex', overflow: 'hidden',
        flexDirection: isReversed ? 'row-reverse' : 'row',
        transition: 'flex-direction 0s',
      }}>
        {/* Text panel */}
        <div style={{
          width: '50%', padding: '0 80px',
          display: 'flex', flexDirection: 'column', justifyContent: 'center',
          borderRight: isReversed ? 'none' : '1px solid var(--border)',
          borderLeft: isReversed ? '1px solid var(--border)' : 'none',
        }}>
          <div style={{ marginBottom: '48px' }}>
            <Eyebrow>Three Layers. One Platform.</Eyebrow>
            <p style={{ fontFamily: 'var(--sans)', fontSize: '14px', color: 'var(--fg-muted)', lineHeight: 1.6, maxWidth: '380px' }}>
              Each layer creates value on its own. Together, they form the industrial nervous system.
            </p>
          </div>
          {LAYERS.map((l, i) => (
            <div key={i}
              onClick={() => setActive(i)}
              style={{
                padding: '20px 0', borderTop: '1px solid var(--border)',
                cursor: 'pointer', transition: 'all 0.3s',
                opacity: active === i ? 1 : 0.35,
              }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <span style={{
                  fontFamily: 'var(--sans)', fontSize: '11px',
                  letterSpacing: '0.1em', color: active === i ? 'var(--accent)' : 'var(--fg-muted)',
                  fontWeight: 500, transition: 'color 0.3s',
                }}>{l.num}</span>
                <span style={{
                  fontFamily: 'var(--sans)', fontSize: '20px', fontWeight: 600,
                  color: 'var(--fg)', letterSpacing: '-0.01em',
                }}>{l.title}</span>
              </div>
              {active === i && (
                <div style={{ marginTop: '4px', marginLeft: '36px' }}>
                  <div style={{ fontFamily: 'var(--sans)', fontSize: '13px', color: 'var(--accent)', fontStyle: 'italic', marginBottom: '8px' }}>{l.sub}</div>
                  <p style={{ fontFamily: 'var(--sans)', fontSize: '15px', fontWeight: 300, color: 'var(--fg-muted)', lineHeight: 1.65, textWrap: 'pretty' }}>{l.body}</p>
                </div>
              )}
            </div>
          ))}
          {/* Progress indicator */}
          <div style={{ display: 'flex', gap: 8, marginTop: '40px' }}>
            {LAYERS.map((_, i) => (
              <div key={i} style={{
                height: 2, flex: 1, borderRadius: 2,
                background: i <= active ? 'var(--accent)' : 'var(--border)',
                transition: 'background 0.4s',
              }} />
            ))}
          </div>
        </div>
        {/* Visual panel */}
        <div style={{
          width: '50%', padding: '0 80px',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: 'var(--bg-card)',
        }}>
          <div style={{ width: '100%', maxWidth: '480px' }}>
            <ImgPlaceholder label={layer.visual} aspectRatio="4/3" />
          </div>
        </div>
      </div>
    </div>
  );
}

function ComplianceTrust() {
  const [active, setActive] = useState(0);
  const timerRef = useRef(null);
  useEffect(() => {
    timerRef.current = setInterval(() => setActive(a => (a + 1) % TRUST_CARDS.length), 3000);
    return () => clearInterval(timerRef.current);
  }, []);
  const handleClick = (i) => {
    clearInterval(timerRef.current);
    setActive(i);
    timerRef.current = setInterval(() => setActive(a => (a + 1) % TRUST_CARDS.length), 3000);
  };
  const card = TRUST_CARDS[active];
  return (
    <div style={{ padding: '120px 0', borderTop: '1px solid var(--border)' }}>
      <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '0 80px' }}>
        <FadeIn style={{ textAlign: 'center', marginBottom: '60px' }}>
          <Eyebrow center>Enterprise Ready</Eyebrow>

        </FadeIn>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.6fr', gap: '1px', background: 'var(--border)', border: '1px solid var(--border)', borderRadius: '16px', overflow: 'hidden' }}>
          <div style={{ background: 'var(--bg)', display: 'flex', flexDirection: 'column' }}>
            {TRUST_CARDS.map((c, i) => (
              <button key={c.badge} onClick={() => handleClick(i)} style={{
                background: active === i ? 'rgba(74,138,191,0.06)' : 'transparent',
                border: 'none', cursor: 'pointer', padding: '22px 28px',
                borderBottom: i < TRUST_CARDS.length - 1 ? '1px solid var(--border)' : 'none',
                borderLeft: active === i ? '3px solid var(--accent)' : '3px solid transparent',
                textAlign: 'left', transition: 'background 0.15s',
              }}>
                <div style={{ fontFamily: 'var(--sans)', fontSize: '11px', letterSpacing: '0.1em', textTransform: 'uppercase', color: active === i ? 'var(--accent)' : 'var(--fg-muted)', fontWeight: 500, marginBottom: '4px' }}>{c.badge}</div>
                <div style={{ fontFamily: 'var(--sans)', fontSize: '15px', fontWeight: 600, color: active === i ? 'var(--fg)' : 'rgba(245,242,237,0.35)', lineHeight: 1.2 }}>{c.title}</div>
                {active === i && (
                  <div style={{ marginTop: 10, height: 2, background: 'var(--border)', borderRadius: 2, overflow: 'hidden' }}>
                    <div key={active} style={{ height: '100%', background: 'var(--accent)', borderRadius: 2, animation: 'trustProgress 3s linear forwards' }} />
                  </div>
                )}
              </button>
            ))}
          </div>
          <div style={{ background: 'var(--bg-card)', padding: '52px 48px', display: 'flex', flexDirection: 'column', justifyContent: 'center', minHeight: '320px' }}>
            <div style={{ fontFamily: 'var(--sans)', fontSize: '11px', letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--accent)', fontWeight: 500, marginBottom: '16px' }}>{card.badge}</div>
            <div style={{ fontFamily: 'var(--sans)', fontSize: 'clamp(26px, 3vw, 38px)', fontWeight: 700, letterSpacing: '-0.02em', lineHeight: 1.1, marginBottom: '20px' }}>{card.title}</div>
            <p style={{ fontFamily: 'var(--sans)', fontSize: '17px', fontWeight: 300, color: 'var(--fg-muted)', lineHeight: 1.75, textWrap: 'pretty', maxWidth: '480px' }}>{card.body}</p>
          </div>
        </div>

    </div>
  );
}
