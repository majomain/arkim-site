<script>
(function () {
  try {
    var stored = localStorage.getItem('arkim-theme');
    var m = document.querySelector('meta[name="theme-color"]');
    if (stored === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      if (m) m.setAttribute('content', '#0A0A0A');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      if (m) m.setAttribute('content', '#F5F2EB');
    }
  } catch (e) {}
  window.__applyArkimTheme = function (mode) {
    var html = document.documentElement;
    if (mode === 'light') {
      html.setAttribute('data-theme', 'light');
    } else {
      html.removeAttribute('data-theme');
    }
    try {
      localStorage.setItem('arkim-theme', mode === 'light' ? 'light' : 'dark');
    } catch (err) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'light' ? '#F5F2EB' : '#0A0A0A');
    try {
      window.dispatchEvent(new Event('arkim-theme'));
    } catch (err) {}
  };
})();
</script>

<script type="text/babel">

// Arkim Homepage — Section Components
// Exports all sections to window for use in main HTML file
// Typography: Avenir Next + Cormorant Garamond (accent); sizes from :root tokens (--title-display, --title-section, --title-card, --text-body, …).

const { useState, useEffect, useRef } = React;
const useViewport = window.useViewport;
const usePrefersReducedMotion = window.usePrefersReducedMotion;
const useArkimTheme = window.useArkimTheme;

// ─── UTILS ──────────────────────────────────────────────────────────────────

function useFadeIn(threshold = 0.12) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } },
      { threshold }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, vis];
}

function FadeIn({ children, delay = 0, y = 28, style = {} }) {
  const [ref, vis] = useFadeIn();
  const reducedMotion = usePrefersReducedMotion();
  const effectiveDelay = reducedMotion ? 0 : delay;
  return (
    <div ref={ref} style={{
      opacity: vis ? 1 : 0,
      transform: reducedMotion ? 'none' : (vis ? 'none' : `translateY(${y}px)`),
      transition: reducedMotion
        ? 'none'
        : `opacity 0.9s cubic-bezier(0.16,1,0.3,1) ${effectiveDelay}s, transform 0.9s cubic-bezier(0.16,1,0.3,1) ${effectiveDelay}s`,
      ...style
    }}>{children}</div>
  );
}

function Eyebrow({ children, center = false }) {
  return (
    <div style={{
      fontFamily: 'var(--sans)',
      fontSize: 'var(--text-eyebrow-size)',
      fontWeight: 500,
      letterSpacing: 'var(--text-eyebrow-tracking)',
      textTransform: 'uppercase',
      color: 'var(--accent)',
      marginBottom: '20px',
      textAlign: center ? 'center' : 'left',

  );
}

}

// ─── INDUSTRIES STRIP ───────────────────────────────────────────────────────

function IndustriesStrip() {
  const reducedMotion = usePrefersReducedMotion();
  const items = ['Pharmaceutical CDMOs', 'Food & Beverage Producers', 'Contract Manufacturers', 'Industrial OEMs', 'Maintenance Service Companies', 'Chemical Processing Plants', 'Automotive Suppliers', 'Energy & Utilities'];

        <div style={{
          display: 'flex', flexWrap: 'wrap', justifyContent: 'center',

const TRUST_CARDS = [
  { badge: '21 CFR Part 11 Ready', title: 'Pharma Ready', body: 'Validation documentation, IQ/OQ/PQ templates, and audit-trail logging built for regulated pharmaceutical environments.' },
  { badge: 'NVIDIA Inception', title: 'AI Infrastructure', body: "Member of NVIDIA's Inception program — built on the same AI infrastructure powering the world's leading industrial platforms." },

  { badge: 'Audit-Ready Documentation', title: 'Full Traceability', body: 'Every repair, every check, every diagnostic event — fully logged, attributed, and exportable for inspection.' },
];

function ComplianceTrust() {
  const { isMobile, isTablet } = useViewport();
  const reducedMotion = usePrefersReducedMotion();
  const sectionPaddingX = isMobile ? 20 : isTablet ? 40 : 80;
  const [active, setActive] = useState(0);
  const timerRef = useRef(null);
  useEffect(() => {
    if (reducedMotion) return;
    timerRef.current = setInterval(() => setActive(a => (a + 1) % TRUST_CARDS.length), 3000);
    return () => clearInterval(timerRef.current);
  }, [reducedMotion]);
  const handleClick = (i) => {
    clearInterval(timerRef.current);
    setActive(i);
    if (!reducedMotion) {
      timerRef.current = setInterval(() => setActive(a => (a + 1) % TRUST_CARDS.length), 3000);
    }
  };
  const card = TRUST_CARDS[active];
  return (
    <div style={{ padding: '120px 0', borderTop: '1px solid var(--border)' }}>
      <div style={{ maxWidth: '1200px', margin: '0 auto', padding: `0 ${sectionPaddingX}px` }}>

          <Eyebrow center>Enterprise Ready</Eyebrow>

        </FadeIn>
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1.6fr', gap: '1px', background: 'var(--border)', border: '1px solid var(--border)', borderRadius: '16px', overflow: 'hidden' }}>
          <div style={{ background: 'var(--bg)', display: 'flex', flexDirection: 'column' }}>
            {TRUST_CARDS.map((c, i) => (
              <button key={c.badge} onClick={() => handleClick(i)} style={{
                background: active === i ? 'var(--accent-soft)' : 'transparent',
                border: 'none', cursor: 'pointer', padding: '22px 28px',
                borderBottom: i < TRUST_CARDS.length - 1 ? '1px solid var(--border)' : 'none',
                borderLeft: active === i ? '3px solid var(--accent)' : '3px solid transparent',
                textAlign: 'left', transition: 'background 0.15s',
              }}>
                <div style={{ fontFamily: 'var(--sans)', fontSize: 'var(--text-eyebrow-size)', letterSpacing: 'var(--text-eyebrow-tracking)', textTransform: 'uppercase', color: active === i ? 'var(--accent)' : 'var(--fg-muted)', fontWeight: 500, marginBottom: '4px' }}>{c.badge}</div>
                <div style={{ fontFamily: 'var(--sans)', fontSize: 'var(--text-label)', fontWeight: 600, color: active === i ? 'var(--fg)' : 'var(--fg-dimmer)', lineHeight: 1.2 }}>{c.title}</div>
                {active === i && (
                  <div style={{ marginTop: 10, height: 2, background: 'var(--border)', borderRadius: 2, overflow: 'hidden' }}>
                    <div key={active} style={{
                      height: '100%',
                      background: 'var(--accent)',
                      borderRadius: 2,
                      width: reducedMotion ? '100%' : undefined,
                      animation: reducedMotion ? 'none' : 'trustProgress 3s linear forwards',
                    }} />
                  </div>
                )}
              </button>
            ))}
          </div>
          <div style={{ background: 'var(--bg-card)', padding: '52px 48px', display: 'flex', flexDirection: 'column', justifyContent: 'center', minHeight: '320px' }}>
            <div style={{ fontFamily: 'var(--sans)', fontSize: 'var(--text-eyebrow-size)', letterSpacing: 'var(--text-eyebrow-tracking)', textTransform: 'uppercase', color: 'var(--accent)', fontWeight: 500, marginBottom: '16px' }}>{card.badge}</div>
            <div style={{ fontFamily: 'var(--sans)', fontSize: 'var(--title-card)', fontWeight: 700, letterSpacing: '-0.02em', lineHeight: 1.1, marginBottom: '20px' }}>{card.title}</div>

          </div>
        </div>
      </div>
    </div>
  );
}

<!-- App -->
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { useViewport, ArkimNav } = window;

function AnnouncementBar({ onDismiss }) {
  const { isMobile } = useViewport();
  return (
    <div style={{
      background: 'var(--announce-bg)', borderBottom: '1px solid var(--announce-border)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: isMobile ? '10px 44px 10px 16px' : '10px 48px', gap: 12, position: 'relative',
      minHeight: 44,
    }}>
      <div style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--accent)', flexShrink: 0 }} />
      <span style={{ fontFamily: 'var(--sans)', fontSize: 'var(--text-caption)', color: 'var(--fg-muted)', lineHeight: 1.45 }}>
        Arkim AI joins the{' '}
        <a href="https://www.nvidia.com/en-us/startups/" target="_blank" rel="noopener noreferrer" style={{ color: 'var(--fg)', textDecoration: 'underline', textUnderlineOffset: '2px' }}>
          NVIDIA Inception Program
        </a>
        {' '}for AI-driven industrial startups
      </span>
      <span style={{ fontFamily: 'var(--sans)', fontSize: 'var(--text-micro)', color: 'var(--accent)' }}>→</span>
      <button onClick={onDismiss} style={{
        position: 'absolute', right: 20, background: 'none',
        border: 'none', color: 'var(--fg-muted)', cursor: 'pointer',
        fontSize: '18px', lineHeight: 1, padding: '8px', minWidth: 44, minHeight: 44,
      }}>×</button>
    </div>
  );
}

function Divider() {
  return <div style={{ height: '1px', background: 'var(--border)', margin: '0' }} />;
}

function App() {
  const headerRef = useRef(null);
  const [announceVisible, setAnnounceVisible] = useState(false);
  const [headerHeight, setHeaderHeight] = useState(109);

  useEffect(() => {
    if (!headerRef.current) return;
    const readHeight = () => setHeaderHeight(headerRef.current ? headerRef.current.getBoundingClientRect().height : 109);
    readHeight();
    const observer = new ResizeObserver(readHeight);
    observer.observe(headerRef.current);
    window.addEventListener('resize', readHeight, { passive: true });
    return () => {
      observer.disconnect();
      window.removeEventListener('resize', readHeight);
    };
  }, [announceVisible]);

  return (
    <div>
      {/* Fixed header: announcement bar + nav together so they never overlap; top inset for notched devices */}
      <div ref={headerRef} style={{
        position: 'fixed', top: 0, left: 0, right: 0, zIndex: 200,
        paddingTop: 'env(safe-area-inset-top, 0px)',
        paddingLeft: 'env(safe-area-inset-left, 0px)',
        paddingRight: 'env(safe-area-inset-right, 0px)',
      }}>
        {announceVisible && <AnnouncementBar onDismiss={() => setAnnounceVisible(false)} />}
        <ArkimNav />
      </div>
      {/* Spacer so content starts below fixed header */}
      <div style={{ height: headerHeight }} />
      <ArkimHero />
      <ArkimIndustriesStrip />
      <ArkimProductVideo />
      <ArkimTheLever />
      <Divider />
      <ArkimPersonas />
      <Divider />
      <ArkimTimeToValue />
      <ArkimComplianceTrust />
      <ArkimFinalCTA />
      <ArkimFooter />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
