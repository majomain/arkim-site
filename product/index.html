<script>
(function () {
  try {
    var stored = localStorage.getItem('arkim-theme');
    var m = document.querySelector('meta[name="theme-color"]');
    if (stored === 'dark') {
      document.documentElement.removeAttribute('data-theme');
      if (m) m.setAttribute('content', '#0A0A0A');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      if (m) m.setAttribute('content', '#FAFAFA');
    }
  } catch (e) {}
  window.__applyArkimTheme = function (mode) {
    var html = document.documentElement;
    if (mode === 'light') {
      html.setAttribute('data-theme', 'light');
    } else {
      html.removeAttribute('data-theme');
    }
    try {
      localStorage.setItem('arkim-theme', mode === 'light' ? 'light' : 'dark');
    } catch (err) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'light' ? '#FAFAFA' : '#0A0A0A');
    try {
      window.dispatchEvent(new Event('arkim-theme'));
    } catch (err) {}
  };
})();
</script>
