<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://use.typekit.net" crossorigin />
<link rel="preconnect" href="https://p.typekit.net" crossorigin />
<link rel="stylesheet" href="https://use.typekit.net/now2kdo.css" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: "proxima-nova", Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #0a0a0a;
    overflow: hidden;
    isolation: isolate;
  }
  .og__texture {
    position: absolute;
    inset: 0;
    background-image: url('https://pub-21bffe7c211448d7818625366c788ae6.r2.dev/bg-og.webp');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0.44;
    pointer-events: none;
    z-index: 0;
  }
  .og__glow {
    position: absolute;
    width: 920px;
    height: 920px;
    right: -200px;
    top: -240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(74, 150, 196, 0.2) 0%, rgba(74, 150, 196, 0.05) 42%, transparent 68%);
    pointer-events: none;
    z-index: 0;
  }
  .og__scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      135deg,
      rgba(10, 10, 10, 0.72) 0%,
      rgba(10, 10, 10, 0.42) 48%,
      rgba(10, 10, 10, 0.58) 100%
    );
    pointer-events: none;
    z-index: 0;
  }
  .og__accent-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 6px;
    height: 100%;
    background: linear-gradient(180deg, #4a96c4 0%, rgba(74, 150, 196, 0.12) 100%);
    z-index: 2;
  }
  .og__content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    padding: 72px 96px;
  }
  .og__logo {
    width: 248px;
    height: auto;
    margin-bottom: 44px;
  }
  .og__headline {
    font-family: "acumin-pro-extra-condensed", Helvetica, sans-serif;
    font-size: 62px;
    font-weight: 800;
    font-style: normal;
    line-height: 0.77;
    letter-spacing: 0.018em;
    text-transform: uppercase;
    color: #f5f2ed;
    max-width: 900px;
    margin-bottom: 28px;
    text-wrap: balance;
  }
  .og__headline-line {
    display: block;
  }
  .og__lead {
    font-family: "proxima-nova", Helvetica, sans-serif;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.55;
    color: rgba(245, 242, 237, 0.88);
    max-width: 760px;
    margin-bottom: 0;
    text-wrap: pretty;
  }
  .og__domain {
    position: absolute;
    left: 96px;
    bottom: 56px;
    z-index: 1;
    font-family: "proxima-nova", Helvetica, sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: rgba(245, 242, 237, 0.42);
    text-transform: lowercase;
  }
  .og__mark {
    position: absolute;
    right: 72px;
    bottom: 52px;
    z-index: 1;
    width: 72px;
    height: 72px;
    border-radius: 10px;
    background: #090c17;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 1px rgba(74, 150, 196, 0.28);
  }
  .og__mark svg {
    width: 44px;
    height: 44px;
  }
</style>
</head>
<body>
  <div class="og">
    <div class="og__texture"></div>
    <div class="og__glow"></div>
    <div class="og__scrim"></div>
    <div class="og__accent-bar"></div>
    <div class="og__content">
      <img class="og__logo" src="../uploads/arkim-side-by-side-wht.svg" alt="" />
      <h1 class="og__headline">
        <span class="og__headline-line">Industrial maintenance,</span>
        <span class="og__headline-line">re-leveraged.</span>
      </h1>
      <p class="og__lead">
        Arkim gives any technician senior-level knowledge from day one — using the phone in their pocket as the diagnostic sensor.
      </p>
    </div>
    <div class="og__domain">arkim.ai</div>
    <div class="og__mark">
      <svg viewBox="0 0 88.8 88.8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <polygon fill="#fff" points="56.89 48.17 62.91 42.16 56.89 36.14 32.83 36.14 32.83 36.14 32.83 30.13 26.82 36.14 32.83 42.16 56.89 42.16 56.89 42.16 56.89 48.17"/>
      </svg>
    </div>
  </div>
</body>
</html>
